# Render — Sanchivue backend (Node.js + Express + MongoDB)
# Deploy this as a Web Service on Render. Root Directory = "backend".
# Docs: https://render.com/docs/web-services

# Render auto-detects the start command from package.json ("start": "node src/server.js").
# You only need to set the Environment Variables below in the Render dashboard.
services:
  - type: web
    name: sanchivue-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: bun install
    startCommand: node src/server.js
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # MONGODB_URI — paste your Atlas connection string
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: sanchivue
      # JWT secrets — generate each with: openssl rand -hex 32
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      # The deployed Vercel frontend URL — Render CORS must allow it for cookies
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      # Cloudinary (free plan) — for avatar/resume uploads
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional integrations
      - key: AI_API_KEY
        sync: false
      - key: JUDGE0_BASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TURN_URL
        sync: false
