<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!--
    Sanchivue mark — an abstract "S" monogram.
    The bold S-curve is drawn as a single stroke with an indigo→emerald gradient.
    Two accent nodes sit where the curve bends, representing the interviewer and
    the candidate — two minds collaborating on one problem. The rounded square
    container ensures the mark reads cleanly on light and dark backgrounds.
  -->
  <defs>
    <linearGradient id="svMarkGrad" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Container: subtle dark tile so the gradient always pops -->
  <rect x="1" y="1" width="38" height="38" rx="10" fill="#0b0f1a"/>
  <rect x="1" y="1" width="38" height="38" rx="10" stroke="#1e293b" stroke-width="1"/>
  <!-- The S curve -->
  <path
    d="M 27 12 C 27 9 23 8 19 8 C 14 8 12 11 12 14 C 12 17 15 18.5 19 19.5 C 24 20.7 28 22 28 25.5 C 28 30 24 32 19 32 C 14 32 11 30 11 27"
    stroke="url(#svMarkGrad)"
    stroke-width="5.4"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Collaboration nodes -->
  <circle cx="12" cy="14" r="2.4" fill="#818cf8"/>
  <circle cx="28" cy="25.5" r="2.4" fill="#10b981"/>
</svg>
