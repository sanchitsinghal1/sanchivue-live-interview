<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 40" fill="none">
  <!-- Sanchivue horizontal lockup: mark + wordmark.
       The wordmark uses a tight, geometric tracking so it stays crisp at any size. -->
  <defs>
    <linearGradient id="svLogoGrad" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <rect x="1" y="1" width="38" height="38" rx="10" fill="#0b0f1a"/>
  <rect x="1" y="1" width="38" height="38" rx="10" stroke="#1e293b" stroke-width="1"/>
  <path
    d="M 27 12 C 27 9 23 8 19 8 C 14 8 12 11 12 14 C 12 17 15 18.5 19 19.5 C 24 20.7 28 22 28 25.5 C 28 30 24 32 19 32 C 14 32 11 30 11 27"
    stroke="url(#svLogoGrad)"
    stroke-width="5.4"
    stroke-linecap="round"
    fill="none"
  />
  <circle cx="12" cy="14" r="2.4" fill="#818cf8"/>
  <circle cx="28" cy="25.5" r="2.4" fill="#10b981"/>
  <!-- Wordmark -->
  <text x="48" y="27" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.6" fill="#e2e8f0">Sanchivue</text>
</svg>
