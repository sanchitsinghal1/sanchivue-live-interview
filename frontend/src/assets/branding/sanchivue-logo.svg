<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 32" fill="none">
  <!-- Sanchivue horizontal logo = mark + wordmark.
       Wordmark uses geometric letterforms so the logotype is crisp at any size. -->
  <defs>
    <linearGradient id="sv-logo-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#020617"/>
  <path d="M8 21.5 L16 14 L24 21.5 L24 26 L16 19 L8 26 Z" fill="url(#sv-logo-grad)"/>
  <path d="M8 12.5 L16 5 L24 12.5 L24 17 L16 10 L8 17 Z" fill="#10b981" opacity="0.85"/>
  <circle cx="16" cy="15.5" r="1.4" fill="#020617"/>

  <!-- Wordmark: "Sanchivue" — geometric sans with a subtle indigo→emerald gradient -->
  <text x="42" y="22" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.5" fill="url(#sv-logo-grad)">Sanchivue</text>
</svg>
